services:
  - type: web
    name: driveguard-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker --chdir backend app.main:app
    envVars:
      - key: PORT
        value: '10000'
      - key: PYTHON_VERSION
        value: '3.11'
