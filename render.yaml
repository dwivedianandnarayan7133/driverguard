services:
  - type: web
    name: driveguard-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: '10000'
      - key: PYTHON_VERSION
        value: '3.11'


